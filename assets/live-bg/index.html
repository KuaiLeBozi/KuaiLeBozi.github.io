<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Background</title>
    <link rel="stylesheet" href="./assets/live-background.css?v=screen-fit-1" />
    <style>
      .setting-button,
      .setting,
      #loading {
        display: none !important;
      }

      #badialog.badialog {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const originalXHRSend = XMLHttpRequest.prototype.send;
        const nativeGetItem = Storage.prototype.getItem;
        const nativeSetItem = Storage.prototype.setItem;
        const blockedAudio = /(?:^|\/)Bgm\.wav(?:$|[?#])/i;
        const srcDescriptor = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
        const nativePlay = HTMLMediaElement.prototype.play;
        const nativePause = HTMLMediaElement.prototype.pause;

        XMLHttpRequest.prototype.send = function (...args) {
          this.addEventListener("load", () => {
            if (!/loadJson\.json(?:$|[?#])/i.test(this.responseURL || "")) return;

            try {
              const data = JSON.parse(this.responseText);
              const model = data.SettingModel;
              const width = window.visualViewport?.width || window.innerWidth;
              const height = window.visualViewport?.height || window.innerHeight;
              const isMobile = width <= 700;
              const isLaptop1080p = !isMobile && width <= 1920 && height <= 1080;

              model.version = 9010;
              model.resolution = "2k";

              // 大屏/2K 默认不覆盖 x/y/scale，直接使用 loadJson.json 里的原始值。
              // 1920x1080 笔记本屏：在这里调人物大小和位置。
              if (isLaptop1080p) {
                model.scale = 0.2;
                model.x = 2400;
                model.y = 1600;
              }

              // 手机屏：在这里单独调人物大小和位置。
              if (isMobile) {
                model.scale = 0.8;
                model.x = 1282;
                model.y = 1600;
              }

              model.bgmVolume = 0;
              model.talkVolume = 0.82;
              model.panelDisplay = false;
              model.showTouch = false;
              model.showTalkDialog = true;

              Object.defineProperty(this, "responseText", { value: JSON.stringify(data) });
              Object.defineProperty(this, "response", { value: JSON.stringify(data) });
            } catch {
              // Keep the packaged background running even if a browser disallows response rewriting.
            }
          });

          return originalXHRSend.apply(this, args);
        };

        Storage.prototype.getItem = function (key) {
          if (key === "CH0295_home.skel") return null;
          return nativeGetItem.call(this, key);
        };

        Storage.prototype.setItem = function (key, value) {
          if (key === "CH0295_home.skel") return;
          return nativeSetItem.call(this, key, value);
        };

        if (srcDescriptor?.set && srcDescriptor?.get) {
          Object.defineProperty(HTMLMediaElement.prototype, "src", {
            configurable: true,
            enumerable: srcDescriptor.enumerable,
            get() {
              return srcDescriptor.get.call(this);
            },
            set(value) {
              if (this.id === "bgm" || blockedAudio.test(String(value || ""))) {
                this.removeAttribute("src");
                return;
              }

              srcDescriptor.set.call(this, value);
            },
          });
        }

        HTMLMediaElement.prototype.play = function () {
          if (this.id === "bgm" || blockedAudio.test(this.currentSrc || this.src || "")) {
            return Promise.resolve();
          }

          return nativePlay.call(this);
        };
        HTMLMediaElement.prototype.pause = function () {
          return nativePause.call(this);
        };

        function postDialogState() {
          const dialog = document.getElementById("badialog");
          if (!dialog) return;

          window.parent?.postMessage({
            source: "kuailebozi-live-dialog",
            visible: dialog.classList.contains("opacity-in"),
            text: dialog.textContent.trim(),
          }, window.location.origin);
        }

        function initDialogBridge() {
          const dialog = document.getElementById("badialog");
          if (!dialog) {
            window.setTimeout(initDialogBridge, 100);
            return;
          }

          const observer = new MutationObserver(postDialogState);
          observer.observe(dialog, {
            attributes: true,
            childList: true,
            characterData: true,
            subtree: true,
          });
          postDialogState();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initDialogBridge, { once: true });
        } else {
          initDialogBridge();
        }
      })();
    </script>
    <script type="module" src="./assets/live-background.js?v=screen-fit-1"></script>
  </body>
</html>
