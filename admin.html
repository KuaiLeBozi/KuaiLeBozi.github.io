<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="KuaileBozi 的项目内容编辑页。" />
    <title>KuaileBozi</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/media/favicon-32.png?v=icon-2" />
    <link rel="apple-touch-icon" href="assets/media/apple-touch-icon.png?v=icon-2" />
    <link rel="stylesheet" href="assets/css/styles.css?v=screen-auto-6" />
  </head>
  <body class="has-entered admin-page">
    <iframe
      class="live-background"
      id="liveBackground"
      src="assets/live-bg/index.html?v=screen-auto-6"
      title=""
      tabindex="-1"
      aria-hidden="true"
      loading="eager"
    ></iframe>

    <div class="scene-overlay" aria-hidden="true"></div>
    <div class="hud-grid" aria-hidden="true"></div>
    <div class="halo halo-large" aria-hidden="true"></div>
    <div class="halo halo-small" aria-hidden="true"></div>
    <div class="custom-cursor" id="customCursor" aria-hidden="true"></div>

    <main class="site-shell detail-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="返回首页">
          <span class="brand-symbol">K</span>
          <span>
            <strong>KuaileBozi</strong>
            <small>内容编辑</small>
          </span>
        </a>

        <nav class="nav-links" aria-label="编辑页操作">
          <a class="nav-tab" href="index.html">首页</a>
          <a class="nav-tab is-active" href="admin.html">管理</a>
          <a class="nav-tab" id="previewLink" href="index.html?panel=projects">预览</a>
        </nav>
      </header>

      <section class="admin-layout">
        <article class="hero panel admin-hero">
          <p class="eyebrow">GitHub Contents API / Owner Edit</p>
          <h1>内容管理台</h1>
          <p>
            登录后可以用更像写 Blog 的方式维护文章、个人信息和联系方式，并保存到 GitHub 仓库。
          </p>
        </article>

        <article class="panel admin-panel">
          <form class="admin-form" id="adminForm">
            <label>
              GitHub Token
              <input id="githubToken" type="password" autocomplete="off" placeholder="粘贴 fine-grained token 或 classic token" />
            </label>
            <div class="admin-login-bar">
              <span id="loginState">未登录：粘贴 Token 后可连接 GitHub。</span>
              <button class="action-link" id="loginButton" type="button">连接 GitHub</button>
            </div>

            <div class="admin-row">
              <label>
                内容类型
                <select id="contentMode">
                  <option value="projects">Blog 文章</option>
                  <option value="profile">主页文字</option>
                  <option value="links">联系与传送门</option>
                </select>
              </label>
              <label id="projectSelectWrap">
                选择项目
                <select id="projectSelect"></select>
              </label>
              <button class="action-link" id="saveProject" type="submit">保存到 GitHub</button>
            </div>

            <div class="project-editor" id="projectEditor">
            <label>
              Blog 标题
              <input id="projectTitleInput" type="text" />
            </label>

            <div class="admin-row">
              <label>
                类型
                <input id="projectTypeInput" type="text" />
              </label>
              <label>
                状态
                <input id="projectStatusInput" type="text" />
              </label>
              <label>
                更新时间
                <input id="projectUpdatedInput" type="date" />
              </label>
            </div>

            <label>
              简介
              <textarea id="projectSummaryInput" rows="4"></textarea>
            </label>

            <label>
              标签
              <input id="projectTagsInput" type="text" placeholder="用逗号分隔，例如 Diffusion, AI, Notes" />
            </label>

            <label>
              正文区块
              <textarea id="projectSectionsInput" rows="12" placeholder="像写日记/Blog 一样写。每个区块用空行分隔，第一行是小标题，后面是正文。"></textarea>
            </label>

            <label>
              链接
              <textarea id="projectLinksInput" rows="5" placeholder="每行一个链接：标题 | https://example.com"></textarea>
            </label>
            </div>

            <div class="profile-editor" id="profileEditor" hidden>
              <label>
                首页眉标
                <input id="profileEyebrowInput" type="text" />
              </label>
              <label>
                欢迎标题
                <input id="profileTitleInput" type="text" />
              </label>
              <label>
                首页简介
                <textarea id="profileBioInput" rows="3"></textarea>
              </label>
              <label>
                档案名
                <input id="profileNameInput" type="text" />
              </label>
              <label>
                个人介绍
                <textarea id="profileAboutInput" rows="5"></textarea>
              </label>
              <label>
                当前状态标题
                <input id="profileNowTitleInput" type="text" />
              </label>
              <label>
                当前状态正文
                <textarea id="profileNowInput" rows="4"></textarea>
              </label>
              <label>
                档案字段
                <textarea id="profileFactsInput" rows="6" placeholder="每行一个字段：标题 | 内容"></textarea>
              </label>
            </div>

            <div class="links-editor" id="linksEditor" hidden>
              <label>
                联系与传送门
                <textarea id="siteLinksInput" rows="8" placeholder="每行一个联系方式：标题 | 值 | 展示文本，例如 QQ | 2406659686 | QQ: 2406659686"></textarea>
              </label>
            </div>

            <p class="admin-status" id="adminStatus">正在读取项目数据。</p>
          </form>
        </article>
      </section>
    </main>

    <script defer src="assets/js/global-ui.js?v=screen-auto-6"></script>
    <script defer src="assets/js/admin.js?v=screen-auto-6"></script>
  </body>
</html>
