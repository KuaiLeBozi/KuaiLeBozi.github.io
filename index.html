<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="KuaileBozi 的个人主页，蔚蓝档案风格 GitHub Pages 静态站点。"
    />
    <title>KuaileBozi</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/media/favicon-32.png?v=icon-2" />
    <link rel="apple-touch-icon" href="assets/media/apple-touch-icon.png?v=icon-2" />
    <link rel="stylesheet" href="assets/css/styles.css?v=mobile-auto-1" />
  </head>
  <body>
    <iframe
      class="live-background"
      id="liveBackground"
      src="assets/live-bg/index.html?v=mobile-auto-1"
      title=""
      tabindex="-1"
      aria-hidden="true"
      loading="eager"
    ></iframe>

    <div class="scene-overlay" aria-hidden="true"></div>
    <div class="hud-grid" aria-hidden="true"></div>
    <div class="halo halo-large" aria-hidden="true"></div>
    <div class="halo halo-small" aria-hidden="true"></div>
    <div class="custom-cursor" id="customCursor" aria-hidden="true"></div>

    <main class="site-shell" id="app">
      <section class="entry-gate" id="entryGate" aria-label="进入主页">
        <div class="entry-brand">KuaileBozi</div>
        <button class="enter-button" id="enterButton" type="button">
          <span>TOUCH TO START</span>
          <small>进入基沃托斯</small>
        </button>
      </section>

      <section class="dashboard" id="dashboard" aria-label="个人主页">
        <header class="topbar">
          <button class="brand" type="button" data-panel="home" aria-label="返回首页">
            <span class="brand-symbol">K</span>
            <span>
              <strong>KuaileBozi</strong>
              <small>夏日值日记录</small>
            </span>
          </button>

          <nav class="nav-links" aria-label="页面分区">
            <button class="nav-tab is-active" type="button" data-panel="profile">档案</button>
            <button class="nav-tab" type="button" data-panel="projects">课题</button>
            <button class="nav-tab" type="button" data-panel="links">通讯</button>
          </nav>
        </header>

        <aside class="fixed-player" id="fixedPlayer" aria-label="固定音乐播放器">
          <button class="music-toggle" id="musicToggle" type="button" aria-label="暂停音乐">
            <span class="music-icon" aria-hidden="true"></span>
          </button>
          <div class="music-meta">
            <span class="panel-label">Now Playing</span>
            <strong id="musicTitle">Hello to Halo</strong>
            <div class="music-controls" aria-label="歌曲切换">
              <button class="music-control" id="musicPrev" type="button" aria-label="上一首">&lt;</button>
              <select class="music-select" id="musicSelect" aria-label="选择歌曲"></select>
              <button class="music-control" id="musicNext" type="button" aria-label="下一首">&gt;</button>
            </div>
            <div class="music-volume" aria-label="音量调节">
              <button class="music-control" id="musicVolumeDown" type="button" aria-label="降低音量">-</button>
              <span id="musicVolumeLabel">22%</span>
              <button class="music-control" id="musicVolumeUp" type="button" aria-label="提高音量">+</button>
            </div>
          </div>
          <audio id="siteMusic" preload="auto"></audio>
        </aside>

        <section class="home-layout" id="home">
          <section class="hero panel" id="heroPanel">
            <p class="eyebrow" id="heroEyebrow">Loading terminal...</p>
            <h2 id="heroTitle">欢迎，老师。</h2>
            <p id="heroBio"></p>
            <div class="hero-actions" id="heroActions"></div>
          </section>

          <section class="panel-switcher" aria-live="polite">
            <article class="panel-view is-active" id="panel-profile" data-panel-view="profile">
              <div class="section-heading">
                <span class="panel-label">档案</span>
                <h3 id="profileName"></h3>
              </div>
              <p id="profileText"></p>
              <dl class="fact-list" id="factList"></dl>
              <div class="duty-note">
                <span class="panel-label">今日值日</span>
                <h4 id="nowTitle"></h4>
                <p id="nowText"></p>
              </div>
            </article>

            <article class="panel-view" id="panel-projects" data-panel-view="projects">
              <div class="section-heading">
                <span class="panel-label">Blog 记录</span>
                <h3>研究与学习笔记</h3>
              </div>
              <div class="project-grid" id="projectGrid"></div>
              <article class="blog-reader" id="blogReader" hidden>
                <button class="blog-back" id="blogBack" type="button">返回 Blog 列表</button>
                <div class="section-heading">
                  <span class="panel-label" id="blogType">Blog</span>
                  <h3 id="blogTitle"></h3>
                </div>
                <p class="blog-summary" id="blogSummary"></p>
                <dl class="project-meta blog-meta" id="blogMeta"></dl>
                <div class="detail-sections" id="blogSections"></div>
                <div class="hero-actions" id="blogActions"></div>
              </article>
            </article>

            <article class="panel-view" id="panel-links" data-panel-view="links">
              <div class="section-heading">
                <span class="panel-label">通讯频道</span>
                <h3>联系与传送门</h3>
              </div>
              <div class="link-list" id="linkList"></div>
              <div class="contact-detail" id="contactDetail" aria-live="polite"></div>
              <section class="comments-section" aria-label="GitHub 评论区">
                <div class="section-heading">
                  <span class="panel-label">留言板</span>
                  <h3>GitHub 评论区</h3>
                </div>
                <p class="comments-hint">使用 GitHub 账号留下讯息，内容会记录在这个页面对应的 Issue 里。</p>
                <div class="github-comments">
                  <script
                    src="https://utteranc.es/client.js"
                    repo="KuaiLeBozi/KuaiLeBozi.github.io"
                    issue-term="pathname"
                    theme="boxy-light"
                    crossorigin="anonymous"
                    async
                  ></script>
                </div>
              </section>
            </article>
          </section>
        </section>
      </section>
    </main>

    <div class="live-dialog" id="liveDialog" aria-live="polite"></div>

    <noscript>
      <p class="noscript">请启用 JavaScript 以加载动态背景与个人档案内容。</p>
    </noscript>

    <script defer src="assets/js/global-ui.js?v=mobile-auto-1"></script>
    <script defer src="assets/js/site-config.js?v=mobile-auto-1"></script>
    <script defer src="assets/js/app.js?v=mobile-auto-1"></script>
  </body>
</html>
