<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="KuaiLeBozi 的个人主页，蔚蓝档案风格 GitHub Pages 静态站点。"
    />
    <title>KuaiLeBozi | 蔚蓝档案风格主页</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=auto-panel-1" />
  </head>
  <body>
    <video
      class="memory-lobby"
      id="memoryLobby"
      src="assets/media/CH0295_home_Start_Idle_01.webm"
      autoplay
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>

    <div class="scene-overlay" aria-hidden="true"></div>
    <div class="hud-grid" aria-hidden="true"></div>
    <div class="halo halo-large" aria-hidden="true"></div>
    <div class="halo halo-small" aria-hidden="true"></div>
    <div class="custom-cursor" id="customCursor" aria-hidden="true"></div>

    <main class="site-shell" id="app">
      <section class="entry-gate" id="entryGate" aria-labelledby="entryTitle">
        <div class="entry-card" aria-hidden="true">
          <span>联邦搜查部 Schale</span>
          <strong>访问认证中</strong>
        </div>
        <div class="entry-mark">
          <span class="entry-kicker">Kivotos Personal Terminal</span>
          <h1 id="entryTitle">KuaiLeBozi</h1>
          <p>正在连接夏日记忆大厅</p>
        </div>
        <div class="entry-loader" aria-hidden="true">
          <span></span>
          <strong>Loading</strong>
        </div>
      </section>

      <section class="dashboard" id="dashboard" aria-label="个人主页">
        <header class="topbar">
          <button class="brand" type="button" data-panel="home" aria-label="返回首页">
            <span class="brand-symbol">K</span>
            <span>
              <strong>KuaiLeBozi</strong>
              <small>夏日值日记录</small>
            </span>
          </button>

          <nav class="nav-links" aria-label="页面分区">
            <button class="nav-tab is-active" type="button" data-panel="profile">档案</button>
            <button class="nav-tab" type="button" data-panel="projects">任务</button>
            <button class="nav-tab" type="button" data-panel="links">通讯</button>
          </nav>
        </header>

        <section class="home-layout" id="home">
          <div class="main-stage">
            <section class="hero panel">
              <p class="eyebrow" id="heroEyebrow">Loading terminal...</p>
              <h2 id="heroTitle">欢迎，老师。</h2>
              <p id="heroBio"></p>
              <div class="hero-actions" id="heroActions"></div>
            </section>

            <section class="panel-switcher" aria-live="polite">
              <article class="panel-view is-active" id="panel-profile" data-panel-view="profile">
                <div class="section-heading">
                  <span class="panel-label">档案</span>
                  <h3 id="profileName"></h3>
                </div>
                <p id="profileText"></p>
                <dl class="fact-list" id="factList"></dl>
                <div class="duty-note">
                  <span class="panel-label">今日值日</span>
                  <h4 id="nowTitle"></h4>
                  <p id="nowText"></p>
                </div>
              </article>

              <article class="panel-view" id="panel-projects" data-panel-view="projects">
                <div class="section-heading">
                  <span class="panel-label">任务档案</span>
                  <h3>进行中的课题</h3>
                </div>
                <div class="project-grid" id="projectGrid"></div>
              </article>

              <article class="panel-view" id="panel-links" data-panel-view="links">
                <div class="section-heading">
                  <span class="panel-label">通讯频道</span>
                  <h3>联系与传送门</h3>
                </div>
                <div class="link-list" id="linkList"></div>
              </article>
            </section>
          </div>

          <aside class="character-dock" id="characterDock" aria-label="可拖动人物展示">
            <div class="drag-handle" id="dragHandle">
              <span>Model Viewer</span>
              <strong>拖动调整位置</strong>
            </div>
            <video
              class="character-model"
              src="assets/media/CH0070-CH0070_Cafe_Reaction.webm"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
              aria-label="咖啡厅人物反应模型"
            ></video>
            <div class="student-card">
              <span class="student-card-tag">Student ID</span>
              <h3>KuaiLeBozi</h3>
              <p>Schale 访问者 / GitHub Pages</p>
            </div>
            <div class="status-panel" aria-label="状态">
              <div>
                <span class="panel-label">Current BGM</span>
                <strong id="statusTrack">Hello to Halo</strong>
              </div>
              <div>
                <span class="panel-label">Session</span>
                <strong>夏日记忆大厅</strong>
              </div>
            </div>
          </aside>
        </section>
      </section>
    </main>

    <div class="player" id="player" aria-label="Music player">
      <button class="icon-button" id="playPauseButton" type="button" aria-label="Pause music">
        <span aria-hidden="true">II</span>
      </button>
      <button class="icon-button" id="nextButton" type="button" aria-label="Next track">
        <span aria-hidden="true">&gt;</span>
      </button>
      <button class="icon-button" id="muteButton" type="button" aria-label="Mute music">
        <span aria-hidden="true">M</span>
      </button>
      <div class="track-meta">
        <span>正在播放</span>
        <strong id="trackTitle">Hello to Halo</strong>
      </div>
    </div>

    <noscript>
      <p class="noscript">请启用 JavaScript 以加载音乐控制与个人档案内容。</p>
    </noscript>

    <script src="assets/js/site-config.js?v=auto-panel-1"></script>
    <script src="assets/js/app.js?v=auto-panel-1"></script>
  </body>
</html>
