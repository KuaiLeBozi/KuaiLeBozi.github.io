<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="KuaiLeBozi 的个人主页，蔚蓝档案风格 GitHub Pages 静态站点。"
    />
    <title>KuaiLeBozi | 蔚蓝档案风格主页</title>
    <link rel="icon" type="image/png" href="assets/media/CH0070_Halo.png?v=click-1080-1" />
    <link rel="apple-touch-icon" href="assets/media/CH0070_Halo.png?v=click-1080-1" />
    <link rel="stylesheet" href="assets/css/styles.css?v=dynamic-bg-1" />
  </head>
  <body>
    <iframe
      class="live-background"
      id="liveBackground"
      src="assets/live-bg/index.html?v=dynamic-bg-1"
      title=""
      tabindex="-1"
      aria-hidden="true"
      loading="eager"
    ></iframe>

    <div class="scene-overlay" aria-hidden="true"></div>
    <div class="hud-grid" aria-hidden="true"></div>
    <div class="halo halo-large" aria-hidden="true"></div>
    <div class="halo halo-small" aria-hidden="true"></div>
    <div class="custom-cursor" id="customCursor" aria-hidden="true"></div>

    <main class="site-shell" id="app">
      <section class="entry-gate" id="entryGate" aria-label="进入主页">
        <button class="enter-button" id="enterButton" type="button">
          <span>TOUCH TO START</span>
          <small>进入基沃托斯</small>
        </button>
      </section>

      <section class="dashboard" id="dashboard" aria-label="个人主页">
        <header class="topbar">
          <button class="brand" type="button" data-panel="home" aria-label="返回首页">
            <span class="brand-symbol">K</span>
            <span>
              <strong>KuaiLeBozi</strong>
              <small>夏日值日记录</small>
            </span>
          </button>

          <nav class="nav-links" aria-label="页面分区">
            <button class="nav-tab is-active" type="button" data-panel="profile">档案</button>
            <button class="nav-tab" type="button" data-panel="projects">任务</button>
            <button class="nav-tab" type="button" data-panel="links">通讯</button>
          </nav>
        </header>

        <section class="home-layout" id="home">
          <section class="hero panel">
            <p class="eyebrow" id="heroEyebrow">Loading terminal...</p>
            <h2 id="heroTitle">欢迎，老师。</h2>
            <p id="heroBio"></p>
            <div class="hero-actions" id="heroActions"></div>
          </section>

          <section class="panel-switcher" aria-live="polite">
            <article class="panel-view is-active" id="panel-profile" data-panel-view="profile">
              <div class="section-heading">
                <span class="panel-label">档案</span>
                <h3 id="profileName"></h3>
              </div>
              <p id="profileText"></p>
              <dl class="fact-list" id="factList"></dl>
              <div class="duty-note">
                <span class="panel-label">今日值日</span>
                <h4 id="nowTitle"></h4>
                <p id="nowText"></p>
              </div>
            </article>

            <article class="panel-view" id="panel-projects" data-panel-view="projects">
              <div class="section-heading">
                <span class="panel-label">任务档案</span>
                <h3>进行中的课题</h3>
              </div>
              <div class="project-grid" id="projectGrid"></div>
            </article>

            <article class="panel-view" id="panel-links" data-panel-view="links">
              <div class="section-heading">
                <span class="panel-label">通讯频道</span>
                <h3>联系与传送门</h3>
              </div>
              <div class="link-list" id="linkList"></div>
            </article>
          </section>
        </section>
      </section>
    </main>

    <noscript>
      <p class="noscript">请启用 JavaScript 以加载动态背景与个人档案内容。</p>
    </noscript>

    <script defer src="assets/js/site-config.js?v=click-1080-1"></script>
    <script defer src="assets/js/app.js?v=dynamic-bg-1"></script>
  </body>
</html>
